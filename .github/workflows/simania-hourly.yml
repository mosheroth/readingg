name: Simania catalog

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: simania-catalog
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-chrome@v1
      - name: Sample new reviews and backfill a batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Add a DATABASE_URL repository secret (the Vercel Postgres connection string)."
            exit 1
          fi
          npm run crawl -- sample --limit 8 --budget 70000
          npm run crawl -- backfill --limit 12 --budget 120000
